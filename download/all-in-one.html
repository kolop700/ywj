<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星云小卫 - 智慧门禁系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.5;
            background-color: #f5f5f5;
            color: #333;
        }
        
        .container {
            max-width: 750px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Header 组件样式 */
        .header {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .app-logo {
            width: 80px;
            height: 80px;
            margin-right: 15px;
            border-radius: 16px;
        }
        
        .app-info h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .app-info p {
            color: #666;
            font-size: 14px;
        }
        
        /* 下载区域样式 */
        .download-section {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .download-btn {
            display: inline-block;
            width: 80%;
            max-width: 280px;
            padding: 12px 24px;
            background: #007AFF;
            color: #fff;
            text-decoration: none;
            border-radius: 24px;
            font-size: 16px;
            margin: 10px 0;
            transition: background-color 0.3s;
        }
        
        .download-btn:hover {
            background: #0056b3;
        }
        
        .wechat-tip {
            display: none;
            color: #666;
            margin: 15px 0;
            padding: 10px;
            background: #f8f8f8;
            border-radius: 8px;
        }
        
        /* 特性区域样式 */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .feature-item {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .feature-icon {
            width: 50px;
            height: 50px;
            margin-bottom: 10px;
        }
        
        .feature-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .feature-desc {
            font-size: 14px;
            color: #666;
        }
        
        /* 截图区域样式 */
        .screenshots {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .screenshot-scroll {
            overflow-x: auto;
            white-space: nowrap;
            padding: 10px 0;
            -webkit-overflow-scrolling: touch;
        }
        
        .screenshot-img {
            display: inline-block;
            width: 200px;
            height: 400px;
            margin-right: 15px;
            border-radius: 8px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部区域 -->
        <div class="header">
            <img class="app-logo" src="images/logo.png" alt="云小卫logo">
            <div class="app-info">
                <h1>星云小卫 1.0.8</h1>
                <p>便捷、安全的智能门禁系统</p>
            </div>
        </div>
        
        <!-- 下载区域 -->
        <div class="download-section">
            <div id="downloadButtons">
                <a href="http://xyoss.yefiot.com/1.0.8.apk" class="download-btn android-btn" style="display: none;">
                    下载安卓版
                </a>
                <a href="https://apps.apple.com/your-app-store-url" class="download-btn ios-btn" style="display: none;">
                    下载iOS版
                </a>
            </div>
            <div class="wechat-tip">
                <p>请点击右上角菜单</p>
                <p>选择"在浏览器中打开"以下载应用</p>
                <img src="images/wechat-guide.png" alt="微信引导" style="width: 200px; margin-top: 10px;">
            </div>
        </div>
        
        <!-- 特性区域 -->
        <div class="features">
            <div class="feature-item">
                <!-- <img class="feature-icon" src="images/icons/icon_o_door.png" alt="便捷开门"> -->
                <div class="feature-title">便捷开门</div>
                <div class="feature-desc">蓝牙/二维码多种开门方式</div>
            </div>
            <div class="feature-item">
                <!-- <img class="feature-icon" src="images/icons/icon_hous_application.png" alt="房屋申请"> -->
                <div class="feature-title">房屋申请</div>
                <div class="feature-desc">在线提交房屋申请，方便快捷</div>
            </div>
            <div class="feature-item">
                <!-- <img class="feature-icon" src="images/icons/icon_login.png" alt="安全可靠"> -->
                <div class="feature-title">安全可靠</div>
                <div class="feature-desc">数据加密，保障安全</div>
            </div>
        </div>
        
        <!-- 截图区域 -->
        <div class="screenshots">
            <div class="screenshot-scroll">
                <img class="screenshot-img" src="images/screenshots/screenshot1.png" alt="应用截图1">
                <img class="screenshot-img" src="images/screenshots/screenshot2.png" alt="应用截图2">
                <img class="screenshot-img" src="images/screenshots/screenshot3.png" alt="应用截图3">
            </div>
        </div>
    </div>

    <script>
        // 检测设备类型和微信环境
        function checkPlatform() {
            const ua = navigator.userAgent.toLowerCase();
            const isWechat = ua.indexOf('micromessenger') !== -1;
            const isAndroid = ua.indexOf('android') !== -1;
            const isIOS = /iphone|ipad|ipod/.test(ua);
            
            // 显示对应的下载按钮
            if (isWechat) {
                document.querySelector('.wechat-tip').style.display = 'block';
                document.querySelector('#downloadButtons').style.display = 'none';
            } else {
                if (isAndroid) {
                    document.querySelector('.android-btn').style.display = 'inline-block';
                } else if (isIOS) {
                    document.querySelector('.ios-btn').style.display = 'inline-block';
                } else {
                    // 如果无法识别设备，显示所有下载按钮
                    document.querySelector('.android-btn').style.display = 'inline-block';
                    document.querySelector('.ios-btn').style.display = 'inline-block';
                }
            }
        }
        
        // 页面加载完成后执行检测
        window.onload = checkPlatform;
    </script>
</body>
</html>
