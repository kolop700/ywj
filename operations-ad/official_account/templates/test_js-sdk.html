{% extends "wx_base.html" %}

{% block title %}测试微信网页{% endblock %}

{% block body %}
    <button id="test">点击测试</button>
    <div>
        <span>订单id:</span>
        <input id="order_id"/>
        <button id="test_pay">测试支付(wx.chooseWXPay)</button>
        <button id="test_pay2">测试支付(WeixinJSBridge)</button>
    </div>

    <script>
        $.ajax({
            url: '/wx/get_wx_config',
            type: 'GET',
            data: {page_url: location.href.split('#')[0].split('?')[0]},
            dataType: 'json',
            success: function (data, status, xhr) {
                if (data.is_success){
                    wx.config({
                      debug: false,
                      appId: data.result.appId,
                      timestamp: data.result.timestamp, // 必填，生成签名的时间戳
                      nonceStr: data.result.nonceStr, // 必填，生成签名的随机串
                      signature: data.result.signature,// 必填，签名
                      jsApiList: ['chooseWXPay', 'chooseImage', 'getNetworkType', 'translateVoice', 'scanQRCode'] // 必填，需要使用的JS接口列表
                    });
                } else {
                    alert(data.message);
                }
            }
        });


        wx.ready(function(){

        });

        wx.error(function(res){
            console.log(res);
            alert('wx.config错误!');
        });

        $('#test').on('click', function(){
            //wx.getNetworkType({
            //  success: function (res) {
            //    var networkType = res.networkType; // 返回网络类型2g，3g，4g，wifi
            //    alert('当前网络类型:' + networkType);
            //  }
            //});

            wx.scanQRCode({
              needResult: 1, // 默认为0，扫描结果由微信处理，1则直接返回扫描结果，
              scanType: ["qrCode","barCode"], // 可以指定扫二维码还是一维码，默认二者都有
              success: function (res) {
                var result = res.resultStr; // 当needResult 为 1 时，扫码返回的结果
                alert(result);
              }
            });

        });

        $('#test_pay').on('click', function(){
            var order_id = $('#order_id').val();
            if (order_id == ''){
                alert('请输入订单id');
                return;
            }
            $.ajax({
                url: '/wx/account/cur_userinfo',
                type: 'GET',
                data: {},
                dataType: 'json',
                success: function (data, status, xhr) {
                    if (data.is_success){
                        $.ajax({
                            url: '/wx/vip/recharge',
                            type: 'POST',
                            data: {
                                token: data.result.token,
                                grade_id: order_id
                            },
                            dataType: 'json',
                            success: function (data, status, xhr) {
                                if (data.is_success){
                                    alert(JSON.stringify(data));
                                    wx.chooseWXPay({
                                      timestamp: data.result.timestamp, // 支付签名时间戳，注意微信jssdk中的所有使用timestamp字段均为小写。但最新版的支付后台生成签名使用的timeStamp字段名需大写其中的S字符
                                      nonceStr: data.result.nonceStr, // 支付签名随机串，不长于 32 位
                                      package: data.result.package, // 统一支付接口返回的prepay_id参数值，提交格式如：prepay_id=\*\*\*）
                                      signType: data.result.signType, // 签名方式，默认为'SHA1'，使用新版支付需传入'MD5'
                                      paySign: data.result.paySign, // 支付签名
                                      success: function (res) {
                                        alert('支付成功');// 支付成功后的回调函数
                                      },
                                      // 支付取消回调函数
                                      cencel: function (res) {
                                        alert('用户取消支付~');
                                      },
                                      // 支付失败回调函数
                                      fail: function (res) {
                                        alert('支付失败~');
                                      },
                                      complete: function(res){
                                        //取消时：{"errMsg": "chooseWxPay:cancel"}
                                        //成功时：{"errMsg": "chooseWxPay:ok"}
                                        alert(JSON.stringify(res));
                                      }
                                    });
                                } else {
                                    alert(data.message);
                                }
                            }
                        });
                    } else {
                        alert(data.message);
                    }
                }
            });
        });

        $('#test_pay2').on('click', function(){
          var order_id = $('#order_id').val();
            if (order_id == ''){
                alert('请输入订单id');
                return;
            }
            $.ajax({
                url: '/wx/account/cur_userinfo',
                type: 'GET',
                data: {},
                dataType: 'json',
                success: function (data, status, xhr) {
                    if (data.is_success){
                        $.ajax({
                            url: '/wx/vip/recharge',
                            type: 'POST',
                            data: {
                                token: data.result.token,
                                grade_id: order_id
                            },
                            dataType: 'json',
                            success: function (data, status, xhr) {
                                if (data.is_success){
                                    alert(JSON.stringify(data));

                                    // 通过这种方式调用支付页面不用引入jweixin-1.6.0.js，也不用先wx.config

                                    function onBridgeReady(){
                                       WeixinJSBridge.invoke(
                                          'getBrandWCPayRequest', {
                                             "appId":data.result.appId,     //公众号名称，由商户传入
                                             "timeStamp":data.result.timestamp,         //时间戳，自1970年以来的秒数
                                             "nonceStr":data.result.nonceStr, //随机串
                                             "package":data.result.package,
                                             "signType":data.result.signType,         //微信签名方式：
                                             "paySign":data.result.paySign //微信签名
                                          },
                                          function(res){
                                              alert(JSON.stringify(res));
                                              if(res.err_msg == "get_brand_wcpay_request:ok" ){
                                              // 使用以上方式判断前端返回,微信团队郑重提示：
                                                    //res.err_msg将在用户支付成功后返回ok，但并不保证它绝对可靠。
                                                alert('成功');
                                              } else if (res.err_msg == "get_brand_wcpay_request:cancel"){
                                                alert('取消');
                                              }
                                       });
                                    }
                                    if (typeof WeixinJSBridge == "undefined"){
                                       if( document.addEventListener ){
                                           document.addEventListener('WeixinJSBridgeReady', onBridgeReady, false);
                                       }else if (document.attachEvent){
                                           document.attachEvent('WeixinJSBridgeReady', onBridgeReady);
                                           document.attachEvent('onWeixinJSBridgeReady', onBridgeReady);
                                       }
                                    }else{
                                       onBridgeReady();
                                    }
                                } else {
                                    alert(data.message);
                                }
                            }
                        });
                    } else {
                        alert(data.message);
                    }
                }
            });
        });
    </script>
{% endblock body %}
