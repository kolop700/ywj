# CloudGuard iOS 壳工程（XcodeGen 规格）
#
# 用法：
#   1) 安装 XcodeGen：brew install xcodegen
#   2) 在本目录执行：xcodegen generate   （生成 CloudGuard.xcodeproj）
#   3) 打开 CloudGuard.xcodeproj，按需设置签名 Team 后编译运行
#
# H5 产物同步：仓库根目录执行 `npm run sync:h5`（会把 H5 构建产物写入 CloudGuard/WebApp）。
name: CloudGuard
options:
  bundleIdPrefix: com.yefiot
  createIntermediateGroups: true
  deploymentTarget:
    # Xcode 26 最低支持部署目标 iOS 15.0；苹果自 2026-04-28 起要求上传 App Store 必须用 iOS 26 SDK（Xcode 26+）构建
    iOS: "15.0"

settings:
  base:
    # marketing 版本（CFBundleShortVersionString）：须高于 App Store Connect 已批准版本（当前 1.0.26），
    # 否则上传被拒（错误码 90062/90186/90478：train 已关闭 / 版本必须高于已批准版本）。
    MARKETING_VERSION: "1.0.27"
    # build number：CI 构建时由 scripts/build-ios.sh 动态覆盖为 1000+run_number（保证递增不减）；
    # 此静态值供本地归档使用，须始终大于 App Store Connect 已上传的历史值（历史上传过 100）。
    CURRENT_PROJECT_VERSION: "127"
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: "NO"
    CLANG_ENABLE_MODULES: "YES"
    # 链接器标志：莱特摩比（Litemize）SDK 要求 -ObjC（加载 ObjC 静态库全部成员；见 iOS编译接入说明.md 4.7）
    OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
    # AppIcon：CloudGuard/Assets.xcassets/AppIcon.appiconset（1024 无 alpha，App Store 要求）
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  CloudGuard:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      # 源码（排除 WebApp，改为下方文件夹引用）
      - path: CloudGuard
        excludes:
          - "WebApp"
          - "WebApp/**"
      # 文件夹引用：整体保留目录结构拷贝进 App Bundle（blue folder）
      - path: CloudGuard/WebApp
        type: folder
    settings:
      base:
        # Bundle ID 必须与 weijia-2.mobileprovision / App Store Connect 一致（2026-09-04 签发，App Store 分发）
        PRODUCT_BUNDLE_IDENTIFIER: com.yefiot.communityios
        INFOPLIST_FILE: CloudGuard/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        # 手动签名（2026-09-28 起）：CI 直接使用已导入的 Apple Distribution 证书 + weijia 描述文件，
        # archive 阶段不再与 Apple 服务器交互（修复自动签名下 GatherProvisioningInputs 长时间卡住 / 401 失败）；
        # API Key 仅在 exportArchive 上传 TestFlight 时使用。
        # 描述文件 weijia：UUID 9a8bbf33-3c54-42b6-9467-641ae8e5caa0（App Store 分发，2027-09-04 到期）。
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: weijia
        # 显式指定分发证书：手动签名下若省略本项，Xcode 默认按 "iOS Development"（开发证书）查找，
        # CI 仅导入 Apple Distribution 时必报 No signing certificate "iOS Development" found；
        # 此处固定为 Apple Distribution（证书已由 CI 导入 build.keychain，CN 前缀匹配）。
        CODE_SIGN_IDENTITY: "Apple Distribution"
        # 开发团队：Shenzhen Yefiot IoT Tech,.LTD（Team ID 与描述文件一致，Mac 上打开工程即自动选中）
        DEVELOPMENT_TEAM: "737647MFYB"
        # Universal Link（微信回跳，配 applinks:xy.yefiot.com，见 CloudGuard/CloudGuard.entitlements）：
        # 前置：开发者后台 App ID 需已开启 Associated Domains 能力，否则自动签名会报错；
        # 先跑通冒烟构建可临时注释下面一行。
        CODE_SIGN_ENTITLEMENTS: CloudGuard/CloudGuard.entitlements
    dependencies:
      - sdk: CoreBluetooth.framework
      - sdk: AVFoundation.framework
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
      - sdk: WebKit.framework
      # StoreKit：VIP 苹果内购（CloudGuard/Pay/PayBridge.swift）
      - sdk: StoreKit.framework
      # ---- 微信 OpenSDK 2.0.8（已放置 Vendor/WechatOpenSDK/ 并启用）----
      # 说明：MiniProgramBridge.swift 以 #if canImport(WechatOpenSDK) 自动切换真实/桩实现；
      #      Info.plist 的微信回跳 scheme 已填 wx4c80533df6184dda（wx + 开放平台 AppId，见 iOS编译接入说明.md）。
      #      静态库：仅链接、不嵌入。xcodegen 对 application target 的 framework 依赖默认 embed: true，
      #      必须显式 embed: false——否则静态库会被拷进 App/Frameworks，归档时触发 Xcode
      #      "Injecting stub binary into codeless framework"（注入空 stub 动态库）补救流程，
      #      显著拖慢/停顿归档签名阶段（日志长时间无新行的疑因）。
      #      XCFramework 含 arm64 真机 + arm64/x86_64 模拟器切片。
      - framework: Vendor/WechatOpenSDK/WechatOpenSDK.xcframework
        embed: false
      # 微信 SDK 依赖的系统库
      - sdk: libz.tbd
      - sdk: libsqlite3.tbd
      - sdk: libc++.tbd
      - sdk: Security.framework
      - sdk: CoreTelephony.framework
      - sdk: SystemConfiguration.framework
      - sdk: CFNetwork.framework
      # AppTrackingTransparency：AdBridge.requestTrackingIfNeeded 主动请求 ATT 授权（弹窗文案已配于 Info.plist）
      - sdk: AppTrackingTransparency.framework
      # ---- Taku 聚合 SDK + 莱特摩比（Litemize）广告 SDK（已确认 CocoaPods 公开源可用，统一 pod 集成）----
      # 已配置于 Podfile（构建顺序：xcodegen generate → pod install → 打开 CloudGuard.xcworkspace）：
      #   pod 'AnyThinkiOS', '6.5.73'                                    # Taku 聚合 SDK 主包
      #   pod 'AnyThinkMediationAdxSmartdigimktCNAdapter', '6.5.78.2.0' # 酷映 Adx SDK（necessary）
      #   pod 'LitemobAd', '1.5.9'             # 莱特摩比 SDK 主包（文档指定版本）
      #   pod 'LitemobTakuAdapter', '1.1.3'    # 莱特摩比 Taku 适配器（文档指定版本）
      # AdBridge.swift 以 #if canImport(AnyThinkSDK) 自动切换真实/桩实现（pod 安装后即为真实实现）。
      # Taku 后台「自定义广告平台」Adapter 类名（已在后台配置）：LMTakuRewardedVideoAdapter/
      #   LMTakuSplashAdapter/LMTakuNativeAdapter/LMTakuBannerAdapter/LMTakuInterstitialAdapter；
      #   appId 大写上传、头部竞价=是。
      # 手动部署方式（可选，一般不用）：framework 放 shell-ios/Vendor/LiteMob/ 后取消下方注释，
      #   需手动补 24 个系统依赖库与 PrivacyInfo.xcprivacy（iOS17）——见 iOS编译接入说明.md 4.7。
      # - framework: Vendor/LiteMob/<按莱特摩比 iOS 包实际文件名填写>.framework
      #   embed: true

schemes:
  CloudGuard:
    build:
      targets:
        CloudGuard: all
    run:
      config: Debug
    archive:
      config: Release
